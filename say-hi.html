<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Say hi · Nardos</title>
  <meta name="description" content="Get in touch with Nardos about roles and freelance work.">
  <link rel="canonical" href="https://madebynardi.com/say-hi">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nardos">
  <meta property="og:title" content="Say hi · Nardos">
  <meta property="og:description" content="Get in touch with Nardos about roles and freelance work.">
  <meta property="og:url" content="https://madebynardi.com/say-hi">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600&family=Lato:wght@400;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600&family=Lato:wght@400;700&display=swap"></noscript>
  <link rel="stylesheet" href="chrome.css?v=18">
  <style>
    :root { --ink:#231F1C; --orange:#EA5B0C; --orange-deep:#D64A1C; --u: min(calc(100vw / 1440), calc(100dvh / 1080)); }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { margin: 0; color: var(--ink); font-family: "Lato", system-ui, sans-serif; font-weight: 400;
           background: #fff url("assets/noise.png") repeat top left / 720px 512px; }


    /* One screen: the picture on one side, a few lines on the other. Nothing scrolls. */
    main { height: 100dvh; display: grid; place-items: center; padding: 120px 56px 56px; }
    .in { width: 100%; max-width: 760px; text-align: center; justify-items: center; display: grid; }

    .pill { position: relative; display: inline-grid; place-items: center; margin: 0 0 22px; padding: .6em 1.7em .5em; }
    .pill img { position: absolute; inset: 0; width: 100%; height: 100%; }
    .pill h1 { position: relative; margin: 0; font-family: "Antonio", sans-serif; font-weight: 400; line-height: 1;
               color: var(--ink); white-space: nowrap; font-size: clamp(40px, calc(var(--u) * 64), 92px); }

    p { margin: 0 0 14px; font-size: max(17px, calc(var(--u) * 18)); line-height: 1.55; max-width: 44ch; }
    p:last-of-type { margin-bottom: 0; }
    .say { margin-top: 26px; font-family: "Antonio", sans-serif; font-weight: 600; font-size: max(18px, calc(var(--u) * 20));
           color: var(--orange-deep); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
    .say:hover, .say:focus-visible { color: var(--orange); }

    .mail { display: inline-block; margin: 34px 0 0; font-family: "Antonio", sans-serif; font-weight: 400; line-height: 1;
            font-size: clamp(28px, calc(var(--u) * 54), 76px); color: var(--ink); text-decoration: none;
            border-bottom: 3px solid var(--orange); padding-bottom: .08em; transition: color .2s; }
    .mail:hover, .mail:focus-visible { color: var(--orange-deep); }
    .elsewhere { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 34px; margin-top: 38px;
                 font-family: "Antonio", sans-serif; font-weight: 600; font-size: max(17px, calc(var(--u) * 19));
                 letter-spacing: .04em; text-transform: uppercase; }
    .elsewhere a { color: var(--orange-deep); text-decoration: none; }
    .elsewhere a:hover, .elsewhere a:focus-visible { color: var(--orange); }
               font-size: max(17px, calc(var(--u) * 18)); letter-spacing: .06em; text-transform: uppercase; color: var(--orange-deep); }

    .shot { display: block; width: 100%; height: auto; max-height: 68dvh; object-fit: contain; }
    .shot--ph { aspect-ratio: 4 / 5; background: #e6f3ef; display: grid; place-items: center;
                border-radius: 12px; font-size: 14px; opacity: .8; }

    @media (max-width: 700px) {
      :root { --u: min(calc(100vw / 412), calc(100dvh / 780)); }
      main { padding: 84px 24px; align-items: center; }   /* the block sits in the middle of the page */
      .in { gap: 0; }   /* the lines sit close together: the spacing below is all there is */
      .media { order: -1; }
      .shot { max-height: 24dvh; margin: 0 auto; width: auto; }
      .shot--ph { width: 46vw; max-height: 24dvh; }
      .pill { margin-bottom: 8px; }
      .pill h1 { font-size: clamp(32px, calc(var(--u) * 42), 56px); }
      p { font-size: 16px; max-width: none; margin-bottom: 0; }
      .mail { margin-top: 14px; font-size: clamp(22px, 7vw, 40px); overflow-wrap: anywhere; }
      .elsewhere { margin-top: 12px; font-size: 16px; gap: 12px 24px; }
      .say { margin-top: 18px; font-size: 17px; }
    }
  </style>
  <script src="fade.js?v=1"></script>
</head>
<body>
  <div class="chrome">
    <a class="layer logo" href="./" style="--x:21; --y:24; --w:103; --h:182;" aria-label="Nardos, home">
      <span class="logo__blob" aria-hidden="true"><img src="assets/first-blob-flex.svg" alt=""><img class="logo__blob-m" src="assets/phone-blob-flex.svg" alt=""></span>
      <span class="logo__text" aria-hidden="true"><img class="logo__r" src="assets/logo-word.svg" alt=""></span>
    </a>
    <nav class="layer nav" style="--x:130; --y:52; --w:120;" aria-label="Main">
      <ul>
        <li><a href="./?work" class="nav__link" data-home>Home</a></li>
        <li><a href="about" class="nav__link">About</a></li>
        <li><a href="say-hi" class="nav__link nav__link--active" aria-current="page">Say Hi!</a></li>
      </ul>
    </nav>
    <div class="edge edge--top"><span>Say hi</span><span id="local-time">Addis Ababa</span><span>Product designer</span></div>
    <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu">
      <svg viewBox="0 0 32 18" width="32" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <path id="burger-a" d="M2 4.5c4-2.2 7 2.2 11 0s7 2.2 11 0 4-1.2 6-.4"/>
        <path id="burger-b" d="M3 14c4-2 6.5 2 10.500 0s7 2 11 0 3.500-1.200 5.500-.3"/>
      </svg>
    </button>
    <nav class="menu" id="menu" aria-label="Menu" aria-hidden="true">
      <div class="menu__blob" aria-hidden="true"></div>
      <ul>
        <li><a href="./?work" class="menu__link" data-home>Home</a></li>
        <li><a href="about" class="menu__link">About</a></li>
        <li><a href="say-hi" class="menu__link menu__link--active" aria-current="page">Say Hi!</a></li>
      </ul>
    </nav>
  </div>


  <main>
    <div class="in">
      <div class="pill"><img src="assets/chapter-blob.svg" alt=""><h1>Say hi</h1></div>
      <p>A role, a project, or a question about any of the work. Write to me and I will answer.</p>
      <a class="mail" href="mailto:nardos@madebynardi.com">nardos@madebynardi.com</a>
      <!-- Other places to find me (LinkedIn, Behance) can go back here later, inside this same nav. -->
    </div>
  </main>

  <script src="chrome.js?v=1"></script>
  <script>
    const timeEl = document.getElementById("local-time");
    const tick = () => { timeEl.textContent = "Addis Ababa, " + new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Africa/Addis_Ababa" }).format(new Date()); };
    tick(); setInterval(tick, 30000);
  </script>
</body>
</html>
