<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" fill="none">
  <defs>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#7E3A1B" opacity=".55"/>
      <circle cx="6.5" cy="5" r="1.1" fill="#7E3A1B" opacity=".4"/>
      <circle cx="3.5" cy="7.5" r="0.9" fill="#C77A4A" opacity=".5"/>
    </pattern>
    <pattern id="flesh" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#CDB896" opacity=".7"/>
      <circle cx="8" cy="7" r=".8" fill="#CDB896" opacity=".5"/>
    </pattern>
  </defs>
  <g transform="translate(260 262) rotate(-13)">
    <!-- guide lines, like a wireframe around the piece -->
    <rect x="-118" y="-153" width="236" height="306" rx="2" stroke="#EA5B0C" stroke-width="1.4" stroke-dasharray="5 5"/>
    <!-- soft shadow -->
    <rect x="-96" y="-127" width="200" height="270" rx="3" fill="#B98C66" opacity=".35"/>
    <!-- flesh side, the unfinished inside -->
    <rect x="-100" y="-135" width="200" height="270" rx="2" fill="#EBDDC8"/>
    <rect x="-100" y="-135" width="200" height="270" rx="2" fill="url(#flesh)"/>
    <!-- top pocket piece -->
    <path d="M-100 -135 H100 V-5 H62 C46 -5 42 -50 28 -50 H-28 C-42 -50 -46 -5 -62 -5 H-100 Z" fill="#A5522A"/>
    <path d="M-100 -135 H100 V-5 H62 C46 -5 42 -50 28 -50 H-28 C-42 -50 -46 -5 -62 -5 H-100 Z" fill="url(#grain)"/>
    <!-- bottom pocket piece -->
    <path d="M-100 135 H100 V5 H62 C46 5 42 50 28 50 H-28 C-42 50 -46 5 -62 5 H-100 Z" fill="#A5522A"/>
    <path d="M-100 135 H100 V5 H62 C46 5 42 50 28 50 H-28 C-42 50 -46 5 -62 5 H-100 Z" fill="url(#grain)"/>
    <!-- stitch marks, drawn but not sewn yet -->
    <path d="M86 16 V121 H-86" stroke="#F4E6D3" stroke-width="2" stroke-dasharray="7 6" stroke-linecap="round"/>
    <!-- cut edge highlight -->
    <path d="M-100 -5 H-62 C-46 -5 -42 -50 -28 -50 H28 C42 -50 46 -5 62 -5 H100" stroke="#D9895A" stroke-width="1.5"/>
  </g>
</svg>
