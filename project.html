<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case study — Nardos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#231F1C; --orange:#EA5B0C; --orange-deep:#D64A1C; --u: min(calc(100vw / 1440), calc(100dvh / 1080)); --pt: 84px; }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { margin: 0; color: var(--ink); font-family: "Lato", system-ui, sans-serif; font-weight: 300; background: #fff url("assets/noise.png") repeat top left / 720px 512px; }

    /* Small labels along the top and bottom edges, same as the work screen */
    .edge { position: fixed; z-index: 4; pointer-events: none; font-size: max(14px, calc(var(--u) * 16)); color: var(--ink); white-space: nowrap; }
    .edge--top { top: 30px; left: 56px; right: 64px; display: flex; justify-content: space-between; align-items: center; }
    .back { pointer-events: auto; display: inline-flex; align-items: center; gap: 8px; font-family: "Antonio", sans-serif; font-weight: 600; font-size: 22px; line-height: 1; color: var(--orange-deep); text-decoration: none; }
    .back:hover, .back:focus-visible { color: var(--orange); }
    .back svg, .edge--bottom svg { display: block; flex: none; }
    .back span, .edge--bottom span { display: block; padding-top: 1px; }
    .edge--bottom { bottom: 26px; left: 56px; display: inline-flex; align-items: center; gap: 8px; font-family: "Antonio", sans-serif; font-weight: 600; font-size: 22px; line-height: 1; letter-spacing: .02em; color: var(--orange); transition: opacity .3s; }
    .edge--bottom.hide { opacity: 0; }
    .edge--bottom .cue-m { display: none; }

    /* Chapter dots on the right edge: where you are, tap to jump */
    .dots { position: fixed; right: 14px; top: 50%; transform: translateY(-50%); z-index: 5; display: grid; gap: 12px; }
    .dots a { width: 15px; height: 15px; background: url(assets/nav-dot-empty.svg) center / 100% 100% no-repeat; }
    .dots a.on { background-image: url(assets/nav-dot.svg); }

    /* One chapter = one whole screen. Only one is ever visible; the page never scrolls between them. */
    #chapters { position: fixed; inset: 0; }
    .chapter { position: absolute; inset: 0; display: flex; flex-direction: column; overflow-y: auto; padding: var(--pt) 44px 56px 24px;
      opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .2s ease, visibility 0s .2s; }
    .chapter.is-active { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .3s ease .2s, visibility 0s .2s; }
    .chapter__in { margin: auto 0; display: grid; gap: 18px; width: 100%; }
    .pill { position: relative; display: inline-grid; place-items: center; margin: 0 0 22px; padding: .6em 1.7em .5em; justify-self: start; }
    .pill img { position: absolute; inset: 0; width: 100%; height: 100%; }
    .pill h1, .pill h2 { position: relative; margin: 0; font-family: "Antonio", sans-serif; font-weight: 400; line-height: 1; color: var(--ink); white-space: nowrap; }
    .pill h1 { font-size: clamp(40px, 9vw, 84px); }
    .pill h2 { font-size: clamp(28px, 7vw, 40px); }
    .text p { margin: 0 0 12px; font-size: 16px; line-height: 1.5; max-width: 62ch; }
    .facts { display: flex; flex-wrap: wrap; gap: 14px 32px; margin-top: 18px; font-size: 16px; }
    .facts b { display: block; margin-bottom: 6px; font-family: "Antonio", sans-serif; font-weight: 600; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; color: var(--orange-deep); }

    .media { display: grid; align-content: start; }
    .fig { margin: 0; }
    .fig figcaption { margin-top: 8px; font-size: 13px; opacity: .8; max-width: 56ch; }
    .shot { display: block; width: auto; max-width: 100%; max-height: 34dvh; border-radius: 12px; box-shadow: 0 14px 34px rgba(35,31,28,.2); }
    .shot--bare { border-radius: 0; box-shadow: none; }
    .shot--ph { width: 100%; aspect-ratio: 4 / 3; max-height: 34dvh; background: #e6f3ef; display: grid; place-items: center; font-size: 14px; opacity: .8; }

    /* Desktop: text on one side (wider), one big image on the other */
    @media (min-width: 900px) {
      :root { --pt: 110px; }
      .chapter { padding: 100px 80px 70px 56px; }
      .chapter__in { grid-template-columns: 1.15fr 1fr; align-items: start; gap: 56px; }
      .chapter:nth-of-type(even) .chapter__in { grid-template-columns: 1fr 1.15fr; }
      .chapter:nth-of-type(even) .media { order: -1; }
      .pill h1 { font-size: clamp(56px, calc(var(--u) * 104), 150px); }
      .pill h2 { font-size: clamp(40px, calc(var(--u) * 54), 80px); }
      .text p { font-size: max(18px, calc(var(--u) * 18)); line-height: 1.55; margin-bottom: 14px; }
      .facts { font-size: max(17px, calc(var(--u) * 17)); gap: 18px 40px; margin-top: 22px; }
      .facts b { font-size: max(18px, calc(var(--u) * 18)); }
      .shot, .shot--ph { max-height: 70dvh; }
    }
    /* A chapter with no image: the text is centred and wider */
    .chapter--text .chapter__in { max-width: 920px; margin: auto; justify-items: center; text-align: center; }
    .chapter--text .pill { justify-self: center; }
    .chapter--text .text { display: grid; justify-items: center; }
    @media (min-width: 900px) {
      .chapter--text .chapter__in, .chapter--text:nth-of-type(even) .chapter__in { grid-template-columns: 1fr; }
      .chapter--text .text p { font-size: max(22px, calc(var(--u) * 24)); max-width: 46ch; }
    }
    /* Phone */
    @media (max-width: 700px) {
      :root { --u: min(calc(100vw / 412), calc(100dvh / 780)); --pt: 78px; }
      .edge--top { top: 22px; left: 24px; right: 24px; font-size: 12px; }
      .back { font-size: 18px; }
      .edge--top span:nth-child(3) { display: none; }
      .edge--bottom { left: 24px; font-size: 17px; }
      .edge--bottom .cue-d { display: none; } .edge--bottom .cue-m { display: block; }
      .chapter { padding-bottom: 64px; }
      .chapter__in { gap: 14px; } .pill { margin-bottom: 14px; }
      .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; margin-top: 12px; font-size: 15px; }
      .facts b { font-size: 15px; margin-bottom: 4px; }
      .shot, .shot--ph { max-height: 30dvh; }
    }
    @media (prefers-reduced-motion: reduce) { .chapter, .chapter.is-active { transition: none; } }
  </style>
</head>
<body>
  <div class="edge edge--top"><a class="back" id="back" href="index.html"><svg viewBox="0 0 22 14" width="22" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 7H2M8 1.5 2 7l6 5.5"/></svg><span>Back to work</span></a><span>Selected work</span><span id="local-time">Addis Ababa</span><span>Product designer</span></div>
  <div class="edge edge--bottom" id="cue"><span class="cue-d">Scroll</span><span class="cue-m">Swipe</span><svg viewBox="0 0 14 22" width="14" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 1v19M1.500 14 7 20l5.500-6"/></svg></div>
  <nav class="dots" id="dots" aria-label="Chapters"></nav>
  <main id="chapters"></main>

  <script>
    /* Edit the text and images for each project here.
       Every project lists its own chapters: a title, one or two paragraphs, and images with captions.
       overlap: true puts two images on top of each other. */
    const LOREM = "Placeholder text. Replace with the real story for this chapter: a few short sentences, not a wall of text.";
    const SOON = ["Overview", "The problem", "The process", "The result"].map(t => ({ title: t, body: [LOREM, LOREM], images: [{ src: null }] }));
    const PROJECTS = {
      "agristelle": {
        name: "Agristelle", role: "Product designer", forWho: "Agristelle farm stays", type: "Booking platform · Web",
        timeline: "3 months", team: "2 designers, 5 others",
        chapters: [
          { title: "Agristelle", big: true,
            body: ["A booking platform for agriturismi, the working farms in the Italian countryside that rent out a few rooms. I designed the hero of the public site, its type and colour balance, the admin panel and the host panel.",
                   "It was a three-month project in a team of seven: two designers, a backend developer, a front-end developer, a project manager, a QA tester and a tech lead. My feedback came from the other designer and the tech lead."],
            images: [{ src: "assets/web-agristelle-overview.png", bare: true, alt: "Agristelle admin panel and host panel on laptop and phone", caption: "" }] },
          { title: "The problem",
            body: ["The old site looked outdated, and the client wanted a modern look. Behind it, the admin panel was Django's default: dense, hard to read, and hard to act on. The host panel was just as cluttered.",
                   "The Django admin panel turned out to be the heaviest part of the project: close to two of the three months went into it."],
            images: [{ src: "assets/web-agristelle-the-problem.png", alt: "The Django admin panel before", caption: "Before: Django's default admin panel." }] },
          { title: "The public site",
            body: ["A visitor comes to look at Italian farm stays, so the first thing they see is one. The hero is a full-width image of an agriturismo, with a search bar and a headline over it. I chose an image over a video because the site has to load fast.",
                   "I also chose the typeface and the balance of colour, based on the brand's own colours. The rest of the public site was designed by the second designer on the team."],
            images: [{ src: "assets/web-agristelle-the-public-site.png", alt: "Agristelle hero", caption: "The hero: one farm stay, one search bar." }] },
          { title: "The admin panel",
            body: ["Most of the data was hidden behind tables. The front was dense, with no icons or colour and no clear sign of progress where data was entered. Everything sat on one scrollable page, with nothing to show where one group of data ended and the next began.",
                   "I grouped the information and put the team's main jobs first: approving hosts, listed properties and disputes. The three newest hosts waiting for approval now stand out, in urgent colours, big numbers and icons."],
            images: [{ video: "assets/web-agristelle-the-admin-panel.mp4", src: "assets/web-agristelle-the-admin-panel.png", alt: "Agristelle admin panel", caption: "Grouped information instead of one long page." }] },
          { title: "The host panel",
            body: ["Hosts use it to list and manage their properties, answer booking requests and keep their calendar up to date, which shows when each farm is available.",
                   "For hosts with several properties it is one place to see them all. It was cluttered too, so I organised it the same way as the admin panel. The panel and the hero took close to a month together."],
            images: [{ src: "assets/web-agristelle-the-host-panel.png", alt: "Agristelle host panel", caption: "All of a host's properties in one place." }] },
          { title: "What's next",
            body: ["The site isn't live yet; some backend work remains.",
                   "The host panel on mobile still needs a design of its own, and time and budget didn't allow it. That's the first thing I'd do with more time."],
            images: [] },
        ],
      },
      "genier": { name: "Genier", role: "Product designer", forWho: "Genier", type: "Placeholder", chapters: SOON },
      "liq-academy": { name: "LIQ Academy", role: "Product designer", forWho: "LIQ Academy", type: "Placeholder", chapters: SOON },
      "amharic-academy": { name: "Amharic Academy", role: "Product designer", forWho: "Amharic Academy", type: "Placeholder", chapters: SOON },
    };
    const slug = new URLSearchParams(location.search).get("p");
    const p = PROJECTS[slug] || PROJECTS["agristelle"];
    document.title = p.name + " — Nardos";
    document.getElementById("back").href = "index.html" + (PROJECTS[slug] ? "?card=" + slug : "");

    const chapters = p.chapters.map((c, i) => ({ ...c, first: i === 0 }));
    /* An image can also carry a short silent video: { video: "assets/clip.mp4", src: "assets/still.png" }.
       src is the still shown until the video loads, and the only thing shown if the visitor prefers reduced motion. */
    const fig = (im) => `<figure class="fig">${im.video
      ? `<video class="shot" data-video="${im.video}" ${im.src ? `poster="${im.src}"` : ""} muted loop playsinline preload="none" aria-label="${im.alt || ""}"></video>`
      : im.src
      ? `<img class="shot${im.bare ? " shot--bare" : ""}" src="${im.src}" alt="${im.alt || ""}">`
      : `<div class="shot shot--ph">Screenshot goes here</div>`}${im.caption ? `<figcaption>${im.caption}</figcaption>` : ""}</figure>`;
    const root = document.getElementById("chapters");
    const dots = document.getElementById("dots");
    chapters.forEach((c, i) => {
      const sec = document.createElement("section");
      sec.className = "chapter"; sec.id = "c" + i;
      const facts = c.first ? `<div class="facts"><div><b>Role</b>${p.role}</div>${p.timeline ? `<div><b>Timeline</b>${p.timeline}</div>` : ""}${p.team ? `<div><b>Team</b>${p.team}</div>` : ""}<div><b>Type</b>${p.type}</div></div>` : "";
      const imgs = c.images || [{ src: null }];
      if (!imgs.length) sec.classList.add("chapter--text");
      sec.innerHTML = `<div class="chapter__in">
        <div class="text">
          <div class="pill"><img src="assets/chapter-blob.svg" alt="">${c.first ? `<h1>${c.title}</h1>` : `<h2>${c.title}</h2>`}</div>
          ${[].concat(c.body).map(t => `<p>${t}</p>`).join("")}${facts}
        </div>
        ${imgs.length ? `<div class="media">${imgs.map(fig).join("")}</div>` : ""}</div>`;
      root.appendChild(sec);
      const d = document.createElement("a"); d.href = "#c" + i; d.setAttribute("aria-label", c.title); d.addEventListener("click", (e) => { e.preventDefault(); goTo(i); }); dots.appendChild(d);
    });
    const timeEl = document.getElementById("local-time");
    const tick = () => { timeEl.textContent = "Addis Ababa, " + new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Africa/Addis_Ababa" }).format(new Date()); };
    tick(); setInterval(tick, 30000);
    /* The pager: exactly one chapter is on screen. Wheel, swipe, arrow keys and the dots all change chapter;
       if a chapter is taller than the window it scrolls inside itself first. */
    const secs = [...document.querySelectorAll(".chapter")];
    let cur = -1, busy = false, rel;
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    /* Videos load and play only while their chapter is on screen, and pause when it leaves. */
    function playVideos(active) {
      secs.forEach((el, k) => el.querySelectorAll("video").forEach((v) => {
        if (k !== active) { v.pause(); return; }
        if (still) return;
        if (!v.src) {
          v.addEventListener("error", () => { if (!v.poster) v.replaceWith(Object.assign(document.createElement("div"), { className: "shot shot--ph", textContent: "Screenshot goes here" })); }, { once: true });
          v.src = v.dataset.video;
        }
        v.play().catch(() => {});
      }));
    }
    function show(i) {
      cur = i;
      secs.forEach((el, k) => el.classList.toggle("is-active", k === i));
      [...dots.children].forEach((d, k) => d.classList.toggle("on", k === i));
      document.getElementById("cue").classList.toggle("hide", i === secs.length - 1);
      secs[i].scrollTop = 0;
      playVideos(i);
      try { history.replaceState(null, "", "#c" + i); } catch (e) {}
    }
    function goTo(i) {
      if (i < 0 || i >= secs.length || i === cur) return;
      busy = true; clearTimeout(rel); rel = setTimeout(() => busy = false, 750);
      show(i);
    }
    const canScroll = (dir) => { const el = secs[cur]; return dir > 0 ? el.scrollTop + el.clientHeight < el.scrollHeight - 2 : el.scrollTop > 2; };
    addEventListener("wheel", (e) => {
      if (Math.abs(e.deltaY) < 3) return;
      const dir = e.deltaY > 0 ? 1 : -1;
      if (canScroll(dir) && !busy) return;           // let a tall chapter scroll itself
      e.preventDefault();
      if (busy) { clearTimeout(rel); rel = setTimeout(() => busy = false, 180); return; }
      goTo(cur + dir);
    }, { passive: false });
    let ty = 0, edgeStart = 0;
    addEventListener("touchstart", (e) => { ty = e.touches[0].clientY; const el = secs[cur]; edgeStart = (el.scrollTop <= 2 ? -1 : 0) + (el.scrollTop + el.clientHeight >= el.scrollHeight - 2 ? 1 : 0); }, { passive: true });
    addEventListener("touchend", (e) => {
      const dy = ty - e.changedTouches[0].clientY;
      if (Math.abs(dy) < 50 || busy) return;
      const dir = dy > 0 ? 1 : -1;
      const atEdge = dir > 0 ? (edgeStart === 1 || edgeStart === 0 && false) || !canScroll(1) && edgeStart >= 1 : !canScroll(-1) && edgeStart <= -1;
      const fits = secs[cur].scrollHeight <= secs[cur].clientHeight + 2;
      if (fits || atEdge) goTo(cur + dir);
    }, { passive: true });
    addEventListener("keydown", (e) => {
      if (["ArrowDown", "PageDown", " "].includes(e.key) && !canScroll(1)) { e.preventDefault(); goTo(cur + 1); }
      else if (["ArrowUp", "PageUp"].includes(e.key) && !canScroll(-1)) { e.preventDefault(); goTo(cur - 1); }
    });
    const start = /^#c(\d+)$/.exec(location.hash);
    show(start && +start[1] < secs.length ? +start[1] : 0);
  </script>
</body>
</html>
