<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case study — Nardos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600&family=Lato:wght@300;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#231F1C; --orange:#EA5B0C; --orange-deep:#D64A1C; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
      background: #fff url("assets/noise.png") repeat top left / 720px 512px;
      color: var(--ink); font-family: "Lato", system-ui, sans-serif; font-weight: 300; text-align: center;
    }
    h1 { font-family: "Antonio", sans-serif; font-weight: 600; font-size: clamp(40px, 8vw, 96px); margin: 0 0 12px; }
    p { margin: 0 0 28px; font-size: 18px; }
    a { font-family: "Antonio", sans-serif; font-weight: 600; font-size: 22px; color: var(--orange-deep); text-decoration: none; }
    a:hover, a:focus-visible { color: var(--orange); text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Case study</h1>
    <p>This case study is coming soon.</p>
    <a id="back" href="index.html">&larr; Back to work</a>
  </main>
  <script>
    const names = { "agristelle": "Agristelle", "genier": "Genier", "liq-academy": "LIQ Academy", "amharic-academy": "Amharic Academy" };
    const slug = new URLSearchParams(location.search).get("p");
    if (names[slug]) {
      document.getElementById("title").textContent = names[slug];
      document.title = names[slug] + " — Nardos";
      document.getElementById("back").href = "index.html?card=" + slug;
    }
  </script>
</body>
</html>
