<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case study — Nardos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600&family=Lato:wght@300;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#231F1C; --orange:#EA5B0C; --orange-deep:#D64A1C; --cream:#F7E6D6; }
    * { box-sizing: border-box; }
    html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }
    body {
      margin: 0; color: var(--ink); font-family: "Lato", system-ui, sans-serif; font-weight: 300;
      background: #fff url("assets/noise.png") repeat top left / 720px 512px;
    }
    .back {
      position: fixed; top: 18px; left: 20px; z-index: 5;
      font-family: "Antonio", sans-serif; font-weight: 600; font-size: 20px;
      color: var(--orange-deep); text-decoration: none;
    }
    .back:hover, .back:focus-visible { color: var(--orange); text-decoration: underline; }

    /* Chapter dots on the right edge: shows where you are, tap to jump */
    .dots { position: fixed; right: 14px; top: 50%; transform: translateY(-50%); z-index: 5; display: grid; gap: 12px; }
    .dots a { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--orange); background: transparent; transition: background .2s; }
    .dots a.on { background: var(--orange); }

    /* One chapter = one full screen */
    .chapter {
      min-height: 100dvh; scroll-snap-align: start;
      display: grid; align-content: center; gap: 18px;
      padding: 84px 44px 48px 24px;
      max-width: 1200px; margin: 0 auto;
    }
    .marker { position: relative; width: min(170px, 42vw); aspect-ratio: 1; display: grid; place-items: center; }
    .marker img { position: absolute; inset: 0; width: 100%; height: 100%; }
    .marker span { position: relative; font-family: "Antonio", sans-serif; font-weight: 600; font-size: 22px; color: var(--orange-deep); text-align: center; line-height: 1.1; padding: 0 16px; }
    h1, h2 { font-family: "Antonio", sans-serif; font-weight: 600; margin: 0 0 12px; line-height: 1; }
    h1 { font-size: clamp(48px, 11vw, 110px); }
    h2 { font-size: clamp(32px, 6vw, 56px); }
    .text p { margin: 0 0 14px; font-size: 17px; line-height: 1.55; max-width: 46ch; }
    .facts { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-top: 8px; font-size: 14px; }
    .facts b { display: block; font-family: "Antonio", sans-serif; font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--orange-deep); }
    .shot { width: 100%; max-width: 560px; border-radius: 12px; box-shadow: 0 14px 34px rgba(35,31,28,.2); display: block; }
    .shot--ph { aspect-ratio: 4/3; background: #e6f3ef; display: grid; place-items: center; color: var(--ink); opacity: .7; font-size: 14px; }

    @media (min-width: 900px) {
      .chapter { grid-template-columns: 1fr 1.15fr; align-items: center; gap: 64px; padding: 100px 80px 60px; }
      .chapter:nth-of-type(even) .media { order: -1; }
      .marker { width: 300px; margin-bottom: 20px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <a class="back" id="back" href="index.html">&larr; Back to work</a>
  <nav class="dots" id="dots" aria-label="Chapters"></nav>
  <main id="chapters"></main>

  <script>
    /* Edit the text and images for each project here. Same shape for every project. */
    const LOREM = "Placeholder text. Replace with the real story for this chapter: a few short sentences, not a wall of text.";
    const PROJECTS = {
      "agristelle": {
        name: "Agristelle", role: "Product designer", forWho: "Agristelle farm stays", type: "Admin panel · Desktop", blob: "assets/front-blob",
        shots: ["assets/agristelle-dashboard-01.png", "assets/agristelle-dashboard-02.png"],
        alts: ["Agristelle admin panel: property owner detail", "Agristelle admin panel: experiences and community overview"],
      },
      "genier": { name: "Genier", role: "Product designer", forWho: "Genier", type: "Placeholder", blob: "assets/blob-2", shots: [], alts: [] },
      "liq-academy": { name: "LIQ Academy", role: "Product designer", forWho: "LIQ Academy", type: "Placeholder", blob: "assets/blob-3", shots: [], alts: [] },
      "amharic-academy": { name: "Amharic Academy", role: "Product designer", forWho: "Amharic Academy", type: "Placeholder", blob: "assets/blob-4", shots: [], alts: [] },
    };
    const slug = new URLSearchParams(location.search).get("p");
    const p = PROJECTS[slug] || PROJECTS["agristelle"];
    document.title = p.name + " — Nardos";
    document.getElementById("back").href = "index.html" + (PROJECTS[slug] ? "?card=" + slug : "");

    const chapters = [
      { label: "Overview", title: p.name, body: LOREM, facts: true, shot: 0 },
      { label: "The problem", title: "The problem", body: LOREM, shot: null },
      { label: "The process", title: "The process", body: LOREM, shot: null },
      { label: "The result", title: "The result", body: LOREM, shot: 1 },
    ];
    const img = (i) => p.shots[i]
      ? `<img class="shot" src="${p.shots[i]}" alt="${p.alts[i]}">`
      : `<div class="shot shot--ph">Screenshot goes here</div>`;
    const root = document.getElementById("chapters");
    const dots = document.getElementById("dots");
    chapters.forEach((c, i) => {
      const sec = document.createElement("section");
      sec.className = "chapter"; sec.id = "c" + i;
      sec.innerHTML = `
        <div class="text">
          <div class="marker"><img src="${p.blob}-fill.svg" alt=""><img src="${p.blob}-line.svg" alt=""><span>${c.label}</span></div>
          ${i === 0 ? `<h1>${c.title}</h1>` : `<h2>${c.title}</h2>`}
          <p>${c.body}</p>
          ${c.facts ? `<div class="facts"><div><b>Role</b>${p.role}</div><div><b>Designed for</b>${p.forWho}</div><div><b>Type</b>${p.type}</div></div>` : ""}
        </div>
        <div class="media">${img(c.shot === null ? 99 : c.shot)}</div>`;
      root.appendChild(sec);
      const d = document.createElement("a"); d.href = "#c" + i; d.setAttribute("aria-label", c.label); dots.appendChild(d);
    });
    const io = new IntersectionObserver((es) => es.forEach(e => {
      if (e.isIntersecting) [...dots.children].forEach((d, i) => d.classList.toggle("on", "c" + i === e.target.id));
    }), { threshold: 0.55 });
    document.querySelectorAll(".chapter").forEach(s => io.observe(s));
  </script>
</body>
</html>
